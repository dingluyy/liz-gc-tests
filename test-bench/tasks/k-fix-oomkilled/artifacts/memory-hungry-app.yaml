apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: webapp-backend
  labels:
    app: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: memory-hog
          # 使用专门的 stress 镜像来分配内存
          image: polinux/stress:1.0.4
          command: ["stress"]
          # stress 的参数：启动 1 个 vm worker，尝试分配 256M 并保持不释放
          args:
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "256M"
            - "--vm-hang"
            - "1"
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            # 用一个简单命令来检测容器是否存活（不依赖 HTTP）
            exec:
              command:
                - /bin/true
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/true
            initialDelaySeconds: 5
            periodSeconds: 5