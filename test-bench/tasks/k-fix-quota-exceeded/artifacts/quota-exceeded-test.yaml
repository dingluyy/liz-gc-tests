# artifacts/quota-exceeded-test.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: quota-fail-ns
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cpu-limit-quota
  namespace: quota-fail-ns
spec:
  # 注入故障：限制该命名空间的总 CPU 限制为 1.0 个核心 (1000m)
  hard:
    limits.cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-cpu-app
  namespace: quota-fail-ns
spec:
  # 触发故障：期望副本数 2，总限制为 2.0 个核心，超出 Quota
  replicas: 2
  selector:
    matchLabels:
      app: high-cpu-app
  template:
    metadata:
      labels:
        app: high-cpu-app
    spec:
      containers:
        - name: cpu-consumer
          image: busybox:latest
          command: ["sh", "-c", "echo 'Running' && sleep 3600"]
          resources:
            limits:
              # 每个 Pod 限制 1.0 个核心
              cpu: "1"
